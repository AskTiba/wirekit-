# wirekit — Dependabot configuration
# Generated by ci-partner skill (Skill 6.0). Keeps dependencies + pinned actions current.
# Pairs with the security stage (.github/workflows/security.yml) and pinned-action policy.
version: 2
updates:
  # Dev/test dependencies (pinned in requirements-dev.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  # Keep GitHub Actions pinned-and-current (supply-chain safety).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

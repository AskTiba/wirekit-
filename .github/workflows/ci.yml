# wirekit — CI (continuous integration)
# Generated by ci-partner skill (Skill 6.0). Mirrors the local commit gate (core-partner §8.4).
# Job graph: test (matrix 3.11-3.14) → ci-success (aggregate)
# Stages omitted by design (scaled to this project, ADR-001):
#   lint / typecheck — no linter or type-checker configured yet (DEBT-001; add with ruff)
#   build — no packaging target; wirekit ships as a single script copied by install.sh
# Required branch-protection status check: "ci-success" (stable name).
name: "wirekit CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  # ── Tests: matrix over supported Python versions ─────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results/pytest.xml
          retention-days: 7
          if-no-files-found: warn

  # ── Aggregate required check (stable name for branch protection) ─────
  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
      - run: echo "All required CI jobs passed."
